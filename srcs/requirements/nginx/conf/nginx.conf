user www-data;
worker_processes auto;
pid /run/nginx.pid; # tells NGINX where to store the process ID (PID) of its master process
error_log /dev/stderr; # sends NGINX error logs to standard error

events {
    worker_connections 768; # maximum number of simultaneous connections each worker process can handle
}

http {
    include /etc/nginx/mime.types; # loads a file containing mappings between file extensions and MIME types
    default_type application/octet-stream;
    access_log /dev/stdout; # Access logs record information about requests (ex. request path, HTTP status, client address)

    server {
        listen 443 ssl; # tells NGINX to listen on port 443 and enable TLS for that listener (IPv4)
        listen [::]:443 ssl; # listener on port 443 for IPv6 addresses
        server_name DOMAIN_PLACEHOLDER;

        ssl_certificate     /etc/nginx/ssl/nginx.crt; # this file contains the certificate including the server's public key (can be shared w clients)
        ssl_certificate_key /etc/nginx/ssl/nginx.key; # The private key is used in the TLS handshake to prove possession of the key associated with the certificate
        ssl_protocols TLSv1.2 TLSv1.3; # tells NGINX to enable TLS versions 1.2 and 1.3 (older versions are obsolete)

        root /var/www/html; # WP files are available at the same path inside NGINX and WP containers through shared volume
        index index.php index.html; # default files NGINX should look for when a request targets a directory (first try php, if not then html)

        location / {
            try_files $uri $uri/ /index.php?$args; # first look for a real file, then a real directory, if neither exists, let WP handle the request (PHP)
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.*)$; # splits a URI into two parts: PHP script path; optional path-info suffix following the script
            fastcgi_pass wordpress:9000; # tells NGINX to forward matching PHP requests to the FastCGI server at wordpress:9000
            fastcgi_index index.php; # default index script for FastCGI requests
            include fastcgi_params; # env variables/parameters required by CGI
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTPS on;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}